<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stuck In Iowa: Dead County</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
canvas {
  display: block;
  margin: 0 auto;
}
</style>
</head>
<body>
<script>
const GameState = {
  food: 5,
  medicine: 2,
  wood: 8,
  survivors: 0,
  day: 1,
  minutes: 8 * 60,
  mission: "Talk To Jim",
  talkedToJim: false,
  zombieDead: false,
  wrenchFound: false,
  returnedWrench: false,
  jimFollowing: false,
  safehouseUnlocked: false,
  inventory: [],
  musicOn: true,
  musicVolume: 0.45,
  bgMusic: null,
  pausedMenuOpen: false,
  hasPistol: true,
  pistolEquipped: false,
  isShooting: false
};

class BaseScene extends Phaser.Scene {
  setupMobile() {
    this.input.addPointer(5);
    this.mobile = { left:false, right:false, up:false, down:false, a:false, b:false, x:false, y:false };
    this.facing = this.facing || "down";
    this.isAttacking = false;
    this.attackCooldown = false;
  }

  createPlayer(x, y) {
    this.player = this.physics.add.sprite(x, y, "donny", 0);
    this.player.setCollideWorldBounds(true);
    this.player.setScale(1.15);
    this.player.body.setSize(42, 44);
    this.player.body.setOffset(43, 70);
    this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
    this.createWeaponOverlay();
  }

  createPlayerAnims() {
    const make = (key, tex, start, end, rate, repeat) => {
      if (!this.textures.exists(tex)) return;
      if (!this.anims.exists(key)) {
        this.anims.create({ key, frames: this.anims.generateFrameNumbers(tex, { start, end }), frameRate: rate, repeat });
      }
    };
    make("walk_down", "donny", 0, 7, 8, -1);
    make("walk_right", "donny", 8, 15, 8, -1);
    make("walk_left", "donny", 16, 23, 8, -1);
    make("walk_up", "donny", 24, 31, 8, -1);
    make("punch_down", "donny_punch", 0, 5, 14, 0);
    make("punch_right", "donny_punch", 6, 11, 14, 0);
    make("punch_left", "donny_punch", 6, 11, 14, 0);
    make("punch_up", "donny_punch", 18, 23, 14, 0);
  }

  createHUD(versionText) {
    this.missionText = this.add.text(20, 20, GameState.mission, {
      fontSize: "24px", color: "#ffff00", fontFamily: "Arial"
    }).setScrollFactor(0).setDepth(1000);

    this.resourceText = this.add.text(20, 58, "", {
      fontSize: "18px", color: "#ffffff", fontFamily: "Arial"
    }).setScrollFactor(0).setDepth(1000);

    this.clockText = this.add.text(1040, 20, "", {
      fontSize: "20px", color: "#ffffff", fontFamily: "Arial"
    }).setScrollFactor(0).setDepth(1000);

    this.tipText = this.add.text(20, 160, "Move: left stick / WASD   Talk: A / E   Attack: X / Space   Shoot: B / F", {
      fontSize: "15px", color: "#dddddd", fontFamily: "Arial"
    }).setScrollFactor(0).setDepth(1000);

    this.inventoryText = this.add.text(20, 195, "", {
      fontSize: "15px", color: "#d6ffd6", fontFamily: "Arial"
    }).setScrollFactor(0).setDepth(1000);

    this.versionText = this.add.text(20, 675, versionText, {
      fontSize: "14px", color: "#bbbbbb", fontFamily: "Arial"
    }).setScrollFactor(0).setDepth(1000);
  }

  updateHUD() {
    this.missionText.setText(GameState.mission);
    this.resourceText.setText(
      "Food: " + GameState.food +
      "\nMedicine: " + GameState.medicine +
      "\nWood: " + GameState.wood +
      "\nSurvivors: " + GameState.survivors
    );
    this.inventoryText.setText("Items: " + (GameState.inventory.length ? GameState.inventory.join(", ") : "None"));
    const h = Math.floor(GameState.minutes / 60).toString().padStart(2, "0");
    const m = Math.floor(GameState.minutes % 60).toString().padStart(2, "0");
    this.clockText.setText("Day " + GameState.day + "  " + h + ":" + m);
  }

  createControls() {
    this.stickBase = this.add.circle(135, 535, 70, 0x000000, 0.42).setScrollFactor(0).setDepth(1000);
    this.stickKnob = this.add.circle(135, 535, 32, 0xffffff, 0.45).setScrollFactor(0).setDepth(1001);
    this.stickHome = { x: 135, y: 535 };
    this.stickTouchId = null;
    this.makeButton(1120, 455, "Y", "y");
    this.makeButton(1060, 525, "X", "x");
    this.makeButton(1180, 525, "B", "b");
    this.makeButton(1120, 595, "A", "a");
    const selectHit = this.add.rectangle(1060, 610, 88, 34, 0x000000, 0.01).setInteractive().setScrollFactor(0).setDepth(1000);
    const startHit = this.add.rectangle(1190, 610, 88, 34, 0x000000, 0.01).setInteractive().setScrollFactor(0).setDepth(1000);

    this.add.text(1060, 610, "SELECT", { fontSize: "13px", color: "#ffffff", fontFamily: "Arial" }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);
    this.add.text(1190, 610, "START", { fontSize: "13px", color: "#ffffff", fontFamily: "Arial" }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);

    // Big visible pause button for mobile testing.
    const pauseBtn = this.add.rectangle(1180, 55, 120, 44, 0x000000, 0.62)
      .setInteractive()
      .setScrollFactor(0)
      .setDepth(1500);
    this.add.text(1180, 55, "PAUSE", {
      fontSize: "18px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setOrigin(0.5).setScrollFactor(0).setDepth(1501);

    selectHit.on("pointerdown", () => this.toggleMusic());
    startHit.on("pointerdown", () => this.togglePauseMenu());
    pauseBtn.on("pointerdown", () => this.togglePauseMenu());
  }

  makeButton(x, y, label, key) {
    const btn = this.add.circle(x, y, 38, 0x333333, 0.72).setInteractive().setScrollFactor(0).setDepth(1000);
    this.add.text(x, y, label, { fontSize: "24px", color: "#ffffff", fontFamily: "Arial" }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);
    btn.on("pointerdown", () => {
      this.mobile[key] = true;
      this.ensureMusic(true);
      if (key === "a") this.tryInteract();
      if (key === "x") this.attack();
      if (key === "b") this.shootPistol();
    });
    btn.on("pointerup", () => { this.mobile[key] = false; });
    btn.on("pointerout", () => { this.mobile[key] = false; });
  }

  handleVirtualStick() {
    let found = false;
    for (const p of this.input.manager.pointers) {
      if (!p || !p.isDown) continue;
      if (p.x < 480) {
        found = true;
        if (this.stickTouchId === null) {
          this.stickTouchId = p.id;
          this.stickHome.x = p.x;
          this.stickHome.y = p.y;
          this.stickBase.x = p.x;
          this.stickBase.y = p.y;
        }
        if (this.stickTouchId === p.id) {
          const dx = p.x - this.stickHome.x;
          const dy = p.y - this.stickHome.y;
          this.mobile.left = dx < -18;
          this.mobile.right = dx > 18;
          this.mobile.up = dy < -18;
          this.mobile.down = dy > 18;
          const dist = Math.min(48, Math.sqrt(dx * dx + dy * dy));
          const angle = Math.atan2(dy, dx);
          this.stickKnob.x = this.stickHome.x + Math.cos(angle) * dist;
          this.stickKnob.y = this.stickHome.y + Math.sin(angle) * dist;
        }
      }
    }
    if (!found) {
      this.stickTouchId = null;
      this.mobile.left = false; this.mobile.right = false; this.mobile.up = false; this.mobile.down = false;
      this.stickHome.x = 135; this.stickHome.y = 535;
      this.stickBase.x = 135; this.stickBase.y = 535;
      this.stickKnob.x = 135; this.stickKnob.y = 535;
    }
  }

  makeDialogue(title, body) {
    if (this.dialogueBox) this.dialogueBox.destroy();
    const box = this.add.container(640, 610).setScrollFactor(0).setDepth(2000);
    const bg = this.add.rectangle(0, 0, 760, 120, 0x000000, 0.78).setStrokeStyle(2, 0xffffff, 0.35);
    const t = this.add.text(-360, -48, title, { fontSize: "20px", color: "#ffff00", fontFamily: "Arial" });
    const b = this.add.text(-360, -15, body + "\n\nPress A / E", { fontSize: "16px", color: "#ffffff", fontFamily: "Arial", wordWrap: { width: 710 } });
    box.add([bg, t, b]);
    this.dialogueBox = box;
    this.time.delayedCall(3500, () => { if (box && box.active) box.destroy(); });
  }


  ensureMusic(forcePlay = false) {
    if (!this.sound) return;

    if (!GameState.bgMusic) {
      GameState.bgMusic = this.sound.add("bg_music", {
        loop: true,
        volume: GameState.musicVolume
      });
    }

    GameState.bgMusic.setVolume(GameState.musicOn ? GameState.musicVolume : 0);

    if ((GameState.musicOn || forcePlay) && !GameState.bgMusic.isPlaying) {
      GameState.bgMusic.play();
    }
  }

  togglePauseMenu() {
    GameState.pausedMenuOpen = !GameState.pausedMenuOpen;

    if (GameState.pausedMenuOpen) {
      this.showPauseMenu();
    } else {
      this.hidePauseMenu();
    }
  }

  showPauseMenu() {
    if (this.pauseMenu) this.pauseMenu.destroy();

    const box = this.add.container(640, 360).setScrollFactor(0).setDepth(3000);
    const bg = this.add.rectangle(0, 0, 620, 360, 0x000000, 0.86).setStrokeStyle(2, 0xffffff, 0.45);

    const title = this.add.text(0, -140, "PAUSED", {
      fontSize: "34px",
      color: "#ffff00",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    const song = this.add.text(0, -95, "Music: Grain Silo Ghosts", {
      fontSize: "18px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    this.musicStatusText = this.add.text(0, -45, "", {
      fontSize: "20px",
      color: "#d6ffd6",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    const toggleBtn = this.add.rectangle(0, 20, 260, 44, 0x333333, 0.95)
      .setInteractive()
      .on("pointerdown", () => this.toggleMusic());

    const toggleTxt = this.add.text(0, 20, "MUSIC ON / OFF", {
      fontSize: "17px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    const equipBtn = this.add.rectangle(0, 72, 260, 44, 0x333333, 0.95)
      .setInteractive()
      .on("pointerdown", () => this.togglePistolEquip());

    this.pistolStatusText = this.add.text(0, 72, "", {
      fontSize: "17px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    const downBtn = this.add.rectangle(-100, 125, 80, 44, 0x333333, 0.95)
      .setInteractive()
      .on("pointerdown", () => this.changeMusicVolume(-0.10));

    const upBtn = this.add.rectangle(100, 125, 80, 44, 0x333333, 0.95)
      .setInteractive()
      .on("pointerdown", () => this.changeMusicVolume(0.10));

    const downTxt = this.add.text(-100, 125, "- VOL", {
      fontSize: "16px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    const upTxt = this.add.text(100, 125, "+ VOL", {
      fontSize: "16px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    const close = this.add.text(0, 160, "Press START / P to return", {
      fontSize: "15px",
      color: "#bbbbbb",
      fontFamily: "Arial"
    }).setOrigin(0.5);

    box.add([bg, title, song, this.musicStatusText, toggleBtn, toggleTxt, equipBtn, this.pistolStatusText, downBtn, upBtn, downTxt, upTxt, close]);
    this.pauseMenu = box;
    this.updatePauseMenuText();
  }

  hidePauseMenu() {
    if (this.pauseMenu) {
      this.pauseMenu.destroy();
      this.pauseMenu = null;
    }
  }

  updatePauseMenuText() {
    if (!this.musicStatusText) return;
    const pct = Math.round(GameState.musicVolume * 100);
    this.musicStatusText.setText("Music: " + (GameState.musicOn ? "ON" : "OFF") + "   Volume: " + pct + "%");
    if (this.pistolStatusText) this.pistolStatusText.setText("Pistol: " + (GameState.pistolEquipped ? "EQUIPPED" : "OFF"));
  }

  toggleMusic() {
    GameState.musicOn = !GameState.musicOn;
    this.ensureMusic(true);
    if (GameState.bgMusic) {
      GameState.bgMusic.setVolume(GameState.musicOn ? GameState.musicVolume : 0);
    }
    this.updatePauseMenuText();
  }

  changeMusicVolume(amount) {
    GameState.musicVolume = Phaser.Math.Clamp(GameState.musicVolume + amount, 0, 1);
    if (GameState.bgMusic) {
      GameState.bgMusic.setVolume(GameState.musicOn ? GameState.musicVolume : 0);
    }
    this.updatePauseMenuText();
  }


  createWeaponOverlay() {
    if (!this.textures.exists("pistol") || !this.player) return;
    this.pistolSprite = this.add.image(this.player.x, this.player.y, "pistol");
    this.pistolSprite.setVisible(false);
    this.pistolSprite.setOrigin(0.5, 0.5);
    this.pistolSprite.setScale(0.25);
    this.pistolSprite.setDepth(2001);
  }

  togglePistolEquip() {
    GameState.pistolEquipped = !GameState.pistolEquipped;
    if (!GameState.pistolEquipped) this.updatePistolOverlay(false);
    this.updatePauseMenuText();
  }

  getPistolPose(face) {
    // Pistol image points LEFT by default. FlipX makes it fire RIGHT.
    const poses = {
      right: { x: 58, y: -18, angle: 0,   flipX: true,  scale: 0.27, flashX: 96,  flashY: -18 },
      left:  { x: -58, y: -18, angle: 0,   flipX: false, scale: 0.27, flashX: -96, flashY: -18 },
      up:    { x: 14, y: -60, angle: 90,  flipX: false, scale: 0.24, flashX: 14,  flashY: -102 },
      down:  { x: 20, y: 30,  angle: -90, flipX: false, scale: 0.24, flashX: 20,  flashY: 78 }
    };
    return poses[face] || poses.right;
  }

  getShootHoldFrame(face) {
    const frames = { down: 5, right: 11, left: 11, up: 23 };
    return frames[face] ?? 11;
  }

  shootPistol() {
    if (!this.player || !GameState.pistolEquipped || this.isShooting) return;

    const shotFace = this.facing || "right";
    this.shotFacing = shotFace;
    this.isShooting = true;
    this.isAttacking = true;
    this.player.setVelocity(0, 0);

    // Draw first, then hold the full arm-extension frame for 1.5 seconds.
    this.player.setTexture("donny_punch");
    this.player.setFlipX(shotFace === "left");
    this.player.setFrame(this.getShootHoldFrame(shotFace));
    this.updatePistolOverlay(false, shotFace);

    this.time.delayedCall(90, () => {
      if (!this.isShooting || this.shotFacing !== shotFace) return;
      this.player.setTexture("donny_punch");
      this.player.setFlipX(shotFace === "left");
      this.player.setFrame(this.getShootHoldFrame(shotFace));
      this.updatePistolOverlay(true, shotFace);
    });

    this.time.delayedCall(150, () => {
      if (!this.isShooting || this.shotFacing !== shotFace) return;
      const p = this.getPistolPose(shotFace);
      const flash = this.add.circle(
        this.player.x + p.flashX,
        this.player.y + p.flashY,
        10,
        0xffcc33,
        0.80
      ).setDepth(2002);
      this.time.delayedCall(90, () => flash.destroy());
    });

    this.time.delayedCall(1500, () => {
      if (this.shotFacing !== shotFace) return;
      this.isShooting = false;
      this.isAttacking = false;
      this.shotFacing = null;
      this.player.setTexture("donny");
      this.player.setFlipX(false);
      this.updatePistolOverlay(false);
    });
  }

  updatePistolOverlay(show = false, face = this.facing) {
    if (!this.pistolSprite || !this.player) return;
    if (!show) {
      this.pistolSprite.setVisible(false);
      return;
    }

    const o = this.getPistolPose(face || this.facing || "right");
    this.pistolSprite.setVisible(true);
    this.pistolSprite.x = this.player.x + o.x;
    this.pistolSprite.y = this.player.y + o.y;
    this.pistolSprite.setAngle(o.angle);
    this.pistolSprite.setFlipX(o.flipX);
    this.pistolSprite.setScale(o.scale);
    this.pistolSprite.setDepth(2001);
  }

  handlePlayerMovement(colliders) {
    const speed = 240;
    this.player.setVelocity(0);
    const left = this.keys.left.isDown || this.mobile.left;
    const right = this.keys.right.isDown || this.mobile.right;
    const up = this.keys.up.isDown || this.mobile.up;
    const down = this.keys.down.isDown || this.mobile.down;
    if (left) this.player.setVelocityX(-speed);
    if (right) this.player.setVelocityX(speed);
    if (up) this.player.setVelocityY(-speed);
    if (down) this.player.setVelocityY(speed);
    this.player.body.velocity.normalize().scale(speed);
    if (colliders) colliders.forEach(obj => { if (obj) this.physics.collide(this.player, obj); });
    if (left) this.facing = "left"; else if (right) this.facing = "right"; else if (up) this.facing = "up"; else if (down) this.facing = "down";
    if (!this.isAttacking) {
      if (left) this.player.anims.play("walk_left", true);
      else if (right) this.player.anims.play("walk_right", true);
      else if (up) this.player.anims.play("walk_up", true);
      else if (down) this.player.anims.play("walk_down", true);
      else this.player.anims.stop();
    }
    if (!this.isShooting) this.updatePistolOverlay(false);
  }

  attack() {
    if (this.attackCooldown || !this.player) return;
    this.attackCooldown = true;
    this.time.delayedCall(350, () => { this.attackCooldown = false; });
    this.isAttacking = true;
    this.player.setTexture("donny_punch");

    if (this.facing === "left") {
      this.player.setFlipX(true);
    } else {
      this.player.setFlipX(false);
    }

    this.player.anims.play("punch_" + this.facing, true);
    this.player.once(Phaser.Animations.Events.ANIMATION_COMPLETE, () => {
      this.isAttacking = false;
      this.player.setTexture("donny");
      this.player.setFlipX(false);
    });
    const slash = this.add.circle(this.player.x, this.player.y, 80, 0xffffff, 0.18);
    this.time.delayedCall(120, () => slash.destroy());
    if (this.zombie && this.zombie.active && !GameState.zombieDead) {
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.zombie.x, this.zombie.y);
      if (d < 120) {
        this.zombie.hp -= 25;
        this.zombie.setTint(0x99ff99);
        this.time.delayedCall(100, () => { if (this.zombie && this.zombie.active) this.zombie.clearTint(); });
        if (this.zombie.hp <= 0) this.killZombie();
      }
    }
  }
}

class MainStreetScene extends BaseScene {
  constructor() { super("MainStreetScene"); }

  preload() {
    this.load.on("loaderror", (file) => {
      console.warn("Asset failed:", file && file.src);
    });
    this.load.spritesheet("donny", "assets/characters/donny_walk_4dir_128x128_phaser.png?v=030", { frameWidth: 128, frameHeight: 128 });
    this.load.spritesheet("donny_punch", "assets/characters/donny_punch_4dir_128x128_phaser.png?v=030", { frameWidth: 128, frameHeight: 128 });
    this.load.image("pistol", "assets/weapons/pistol.png?v=043");
    this.load.image("auto_shop", "assets/buildings/auto_shop.png?v=030");
    this.load.image("auto_repair_sign", "assets/signs/auto_repair_sign.png?v=038");
    this.load.image("road_tiles", "assets/tiles/road_tiles_32x32.png?v=033");
    this.load.spritesheet("mainstreet_large_props", "assets/props/mainstreet_large_props_256x128.png?v=043", { frameWidth: 256, frameHeight: 128 });
    this.load.spritesheet("mainstreet_small_props", "assets/props/mainstreet_small_props_128x128.png?v=043", { frameWidth: 128, frameHeight: 128 });
    this.load.spritesheet("zombie_worker_walk", "assets/zombies/zombie_worker_walk.png?v=043", { frameWidth: 128, frameHeight: 128 });
    this.load.spritesheet("zombie_worker_attack", "assets/zombies/zombie_worker_attack.png?v=043", { frameWidth: 128, frameHeight: 128 });
    this.load.spritesheet("zombie_worker_hurt_ko", "assets/zombies/zombie_worker_hurt_ko.png?v=043", { frameWidth: 128, frameHeight: 128 });
    this.load.audio("bg_music", "assets/audio/Grain Silo Ghosts.mp3?v=033");
  }

  create(data) {
    this.setupMobile();
    this.worldW = 2400; this.worldH = 1400;
    this.physics.world.setBounds(0, 0, this.worldW, this.worldH);
    this.cameras.main.setBounds(0, 0, this.worldW, this.worldH);
    this.solidObjects = this.physics.add.staticGroup();
    this.makeMap();
    const spawnX = data && data.fromInterior ? 965 : 1200;
    const spawnY = data && data.fromInterior ? 520 : 720;
    this.createPlayer(spawnX, spawnY);
    this.createPlayerAnims();
    this.createJim();
    this.createZombie();
    this.keys = this.input.keyboard.addKeys({ up:"W", down:"S", left:"A", right:"D", interact:"E", attack:"SPACE", shoot:"F", pause:"P", music:"M" });
    this.createHUD("v0.4.3 - Bigger Cars + Held Shooting + Worker Zombie");
    this.createControls();
    this.ensureMusic();
    this.input.once("pointerdown", () => this.ensureMusic(true));
  }

  makeMap() {
    this.map = this.make.tilemap({ tileWidth: 32, tileHeight: 32, width: 75, height: 45 });
    const tiles = this.map.addTilesetImage("road_tiles", "road_tiles", 32, 32, 0, 0);
    const ground = this.map.createBlankLayer("ground", tiles, 0, 0);
    const ASPHALT = 0, ASPHALT_DARK = 1, YELLOW_LINE = 2, DASHED_YELLOW = 3, WHITE_LINE = 4;
    const SIDEWALK = 24, SIDEWALK_CRACKED = 25, GRAVEL = 32, DIRT = 41, GRASS = 48, GRASS_DARK = 49, TALL_GRASS = 50, PATH = 53;
    ground.fill(GRASS);
    for (let y = 0; y < 45; y++) for (let x = 0; x < 75; x++) {
      const n = (x * 17 + y * 31) % 19;
      if (n === 0) ground.putTileAt(GRASS_DARK, x, y);
      if (n === 5) ground.putTileAt(TALL_GRASS, x, y);
    }
    for (let x = 0; x < 75; x++) {
      ground.putTileAt(TALL_GRASS, x, 0); ground.putTileAt(TALL_GRASS, x, 1); ground.putTileAt(GRASS_DARK, x, 2);
      ground.putTileAt(TALL_GRASS, x, 42); ground.putTileAt(TALL_GRASS, x, 43); ground.putTileAt(GRASS_DARK, x, 44);
    }
    for (let y = 17; y <= 27; y++) for (let x = 0; x < 75; x++) ground.putTileAt((x + y) % 9 === 0 ? ASPHALT_DARK : ASPHALT, x, y);
    for (let x = 0; x < 75; x++) {
      ground.putTileAt(SIDEWALK, x, 15); ground.putTileAt(SIDEWALK_CRACKED, x, 16);
      ground.putTileAt(SIDEWALK_CRACKED, x, 28); ground.putTileAt(SIDEWALK, x, 29);
      ground.putTileAt(GRAVEL, x, 14); ground.putTileAt(GRAVEL, x, 30);
    }
    for (let x = 0; x < 75; x += 7) {
      ground.putTileAt(DASHED_YELLOW, x, 22); ground.putTileAt(DASHED_YELLOW, x + 1, 22); ground.putTileAt(YELLOW_LINE, x + 2, 22);
    }
    const driveways = [8, 21, 36, 50, 64];
    for (const dx of driveways) { for (let y = 14; y <= 16; y++) ground.putTileAt(DIRT, dx, y); for (let y = 28; y <= 30; y++) ground.putTileAt(DIRT, dx, y); }
    for (let y = 30; y < 42; y++) { ground.putTileAt(PATH, 15, y); ground.putTileAt(PATH, 43, y); }
    for (let y = 7; y <= 14; y++) for (let x = 29; x <= 45; x++) ground.putTileAt((x + y) % 5 === 0 ? ASPHALT_DARK : ASPHALT, x, y);
    for (let x = 31; x <= 43; x += 4) { ground.putTileAt(WHITE_LINE, x, 13); ground.putTileAt(WHITE_LINE, x, 14); }

    this.makeBuilding(250, 260, 300, 220, "GAS", true);
    this.makeBuilding(680, 260, 330, 220, "DINER", true);
    this.autoShopSprite = this.add.image(1150, 260, "auto_shop").setDisplaySize(720, 340);
    this.add.image(1115, 205, "auto_repair_sign").setScale(0.34).setDepth(900);
    this.autoShopDoorZone = this.add.zone(965, 425, 72, 100);
    this.physics.add.existing(this.autoShopDoorZone, true);
    this.autoShopBlocker = this.add.rectangle(1150, 245, 680, 220, 0xff0000, 0);
    this.physics.add.existing(this.autoShopBlocker, true);
    this.enterAutoShop = this.add.rectangle(965, 430, 52, 52, 0x111111, 0.01);
    // Main Street new prop sheets.
    // assets/props/mainstreet_large_props_256x128.png
    // Row 1: pickup, sedan, dumpster, tire rack
    // Row 2: storefronts
    this.makeStreetLargeProp(820, 420, 3, 0.46, 120, 40);      // tire rack
    this.makeStreetLargeProp(1465, 420, 2, 0.42, 120, 50);     // dumpster
    this.makeStreetLargeProp(515, 475, 0, 0.68, 176, 62);      // abandoned pickup
    this.makeStreetLargeProp(1210, 510, 1, 0.64, 164, 58);     // abandoned sedan

    // assets/props/mainstreet_small_props_128x128.png
    this.makeStreetSmallProp(265, 685, 0, 0.55, 32, 42);       // cone / marker
    this.makeStreetSmallProp(1950, 690, 2, 0.55, 32, 52);      // hydrant / sign-sized prop
    this.makeStreetSmallProp(310, 1020, 1, 0.55, 36, 28);      // mailbox
    this.makeStreetSmallProp(810, 1020, 1, 0.55, 36, 28);      // mailbox
    this.makeStreetSmallProp(1270, 1015, 4, 0.55, 40, 36);     // trash can
    this.makeStreetSmallProp(1580, 1015, 4, 0.55, 40, 36);     // trash can
    this.makeStreetSmallProp(1100, 465, 6, 0.62, 64, 26);      // pallet
    this.makeStreetSmallProp(930, 430, 7, 0.55, 55, 36);       // small tire stack
  }

  makeBuilding(x, y, w, h, label, solid) {
    this.add.rectangle(x, y, w, h, 0x4b4b4b);
    this.add.rectangle(x, y - h / 2 + 20, w, 40, 0x222222);
    this.add.rectangle(x, y + h / 2 - 18, 54, 36, 0x111111);
    this.add.text(x, y - 5, label, { fontSize:"24px", color:"#ffffff", fontFamily:"Arial" }).setOrigin(0.5);
    if (solid) {
      const blocker = this.add.rectangle(x, y - 10, w, h - 45, 0x000000, 0);
      this.physics.add.existing(blocker, true);
      this.solidObjects.add(blocker);
    }
  }

  makeSolidProp(x, y, w, h, color, label) {
    const prop = this.add.rectangle(x, y, w, h, color, 0.95);
    this.physics.add.existing(prop, true);
    this.solidObjects.add(prop);
    if (label) this.add.text(x, y, label, { fontSize:"11px", color:"#ffffff", fontFamily:"Arial" }).setOrigin(0.5);
    return prop;
  }

  makePropSprite(key, x, y, frame, scale, hitW, hitH, rotateVertical = false) {
    if (!this.textures.exists(key)) return null;
    const sprite = this.add.image(x, y, key, frame);
    sprite.setScale(scale);
    sprite.setDepth(y);

    if (rotateVertical) sprite.setAngle(90);

    if (hitW && hitH) {
      const blocker = this.add.rectangle(x, y, hitW, hitH, 0xff0000, 0);
      this.physics.add.existing(blocker, true);
      this.solidObjects.add(blocker);
    }

    return sprite;
  }

  makeStreetLargeProp(x, y, frame, scale, hitW, hitH, rotateVertical = false) {
    return this.makePropSprite("mainstreet_large_props", x, y, frame, scale, hitW, hitH, rotateVertical);
  }

  makeStreetSmallProp(x, y, frame, scale, hitW, hitH, rotateVertical = false) {
    return this.makePropSprite("mainstreet_small_props", x, y, frame, scale, hitW, hitH, rotateVertical);
  }

  createJim() {
    this.jim = this.add.rectangle(1030, 500, 42, 62, 0x00ffff);
    this.jimLabel = this.add.text(1005, 450, "JIM", { fontSize:"18px", color:"#ffffff", fontFamily:"Arial" });
    if (GameState.safehouseUnlocked) { this.jim.x = 1150; this.jim.y = 500; }
  }

  createZombieAnims() {
    if (!this.textures.exists("zombie_worker_walk")) return;
    const make = (key, tex, start, end, rate, repeat) => {
      if (!this.anims.exists(key)) {
        this.anims.create({ key, frames: this.anims.generateFrameNumbers(tex, { start, end }), frameRate: rate, repeat });
      }
    };
    make("zombie_walk_down", "zombie_worker_walk", 0, 7, 7, -1);
    make("zombie_walk_up", "zombie_worker_walk", 8, 15, 7, -1);
    make("zombie_walk_right", "zombie_worker_walk", 16, 23, 7, -1);
    make("zombie_walk_left", "zombie_worker_walk", 24, 31, 7, -1);
    make("zombie_attack_down", "zombie_worker_attack", 0, 7, 9, 0);
    make("zombie_die_down", "zombie_worker_hurt_ko", 0, 7, 7, 0);
  }

  createZombie() {
    if (GameState.zombieDead) return;
    this.createZombieAnims();
    this.zombie = this.physics.add.sprite(350, 1180, "zombie_worker_walk", 0);
    this.zombie.setScale(1.0);
    this.zombie.setCollideWorldBounds(true);
    this.zombie.body.setSize(42, 48);
    this.zombie.body.setOffset(43, 70);
    this.zombie.hp = 100;
    this.zombieFacing = "down";
    this.zombieLabel = this.add.text(295, 1130, "WORKER WALKER", { fontSize:"15px", color:"#d6ffd6", fontFamily:"Arial" });
  }

  tryInteract() {
    if (this.dialogueBox && this.dialogueBox.active) this.dialogueBox.destroy();
    const dJim = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.jim.x, this.jim.y);
    if (dJim < 150) {
      if (!GameState.talkedToJim) {
        GameState.talkedToJim = true;
        GameState.mission = "Secure Auto Shop";
        this.makeDialogue("Jim", "Thank God somebody is still alive. We need that auto shop secured before dark.");
      } else if (GameState.wrenchFound && !GameState.returnedWrench) {
        GameState.returnedWrench = true;
        GameState.jimFollowing = true;
        GameState.survivors = Math.max(GameState.survivors, 1);
        GameState.mission = "Escort Jim To Auto Shop";
        this.makeDialogue("Jim", "You found the wrench. Good. I'm coming with you.");
      } else if (GameState.safehouseUnlocked) {
        this.makeDialogue("Jim", "Auto shop is ours for now. Next we search the houses.");
      } else {
        this.makeDialogue("Jim", "Clear the walker and check the toolbox inside the shop.");
      }
      return;
    }
    const dDoor = Phaser.Math.Distance.Between(this.player.x, this.player.y, 965, 430);
    if (dDoor < 85) {
      this.scene.start("AutoShopInteriorScene");
      return;
    }
  }

  killZombie() {
    GameState.zombieDead = true;
    if (this.zombie) {
      this.zombie.setVelocity(0, 0);
      this.zombie.setTexture("zombie_worker_hurt_ko");
      this.zombie.setScale(1.0);
      this.zombie.anims.play("zombie_die_down", true);
      this.zombie.once(Phaser.Animations.Events.ANIMATION_COMPLETE, () => {
        if (!this.zombie) return;
        this.zombie.setTexture("zombie_worker_hurt_ko");
        this.zombie.setFrame(7);
        this.zombie.body.enable = false;
        this.zombie.setTint(0xaaaaaa);
      });
    }
    if (this.zombieLabel) this.zombieLabel.destroy();
    GameState.mission = "Search Auto Shop Toolbox";
    this.makeDialogue("Mission", "Zombie down. Search the auto shop toolbox.");
  }

  updateZombie() {
    if (!this.zombie || !this.zombie.active || GameState.zombieDead) return;
    const zombieDist = Phaser.Math.Distance.Between(this.zombie.x, this.zombie.y, this.player.x, this.player.y);
    if (zombieDist < 600) {
      const dx = this.player.x - this.zombie.x;
      const dy = this.player.y - this.zombie.y;
      const angle = Phaser.Math.Angle.Between(this.zombie.x, this.zombie.y, this.player.x, this.player.y);
      this.zombie.x += Math.cos(angle) * 0.9;
      this.zombie.y += Math.sin(angle) * 0.9;
      if (Math.abs(dx) > Math.abs(dy)) this.zombieFacing = dx >= 0 ? "right" : "left";
      else this.zombieFacing = dy >= 0 ? "down" : "up";
      this.zombie.anims.play("zombie_walk_" + this.zombieFacing, true);
    } else {
      this.zombie.anims.stop();
      this.zombie.setFrame(0);
    }
    if (this.zombieLabel) { this.zombieLabel.x = this.zombie.x - 55; this.zombieLabel.y = this.zombie.y - 70; }
  }

  updateJimFollow() {
    if (!GameState.jimFollowing || GameState.safehouseUnlocked) return;
    const dist = Phaser.Math.Distance.Between(this.jim.x, this.jim.y, this.player.x, this.player.y);
    if (dist > 90) {
      const angle = Phaser.Math.Angle.Between(this.jim.x, this.jim.y, this.player.x, this.player.y);
      this.jim.x += Math.cos(angle) * 2.0;
      this.jim.y += Math.sin(angle) * 2.0;
    }
    this.jimLabel.x = this.jim.x - 25; this.jimLabel.y = this.jim.y - 50;
    const safeDist = Phaser.Math.Distance.Between(this.jim.x, this.jim.y, 1150, 430);
    if (safeDist < 130) {
      GameState.safehouseUnlocked = true;
      GameState.jimFollowing = false;
      GameState.food += 3; GameState.medicine += 1; GameState.wood += 5;
      GameState.mission = "AUTO SHOP SECURED";
      this.makeDialogue("Safehouse", "Auto Shop secured. Food +3, Medicine +1, Wood +5.");
    }
  }

  update() {
    this.handleVirtualStick();
    if (Phaser.Input.Keyboard.JustDown(this.keys.pause)) this.togglePauseMenu();
    if (Phaser.Input.Keyboard.JustDown(this.keys.music)) this.toggleMusic();
    if (GameState.pausedMenuOpen) {
      this.player.setVelocity(0);
      this.updateHUD();
      return;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keys.interact)) this.tryInteract();
    if (Phaser.Input.Keyboard.JustDown(this.keys.attack)) this.attack();
    this.handlePlayerMovement([this.autoShopBlocker, this.solidObjects]);
    if (this.physics.overlap(this.player, this.autoShopDoorZone)) { this.scene.start("AutoShopInteriorScene"); return; }
    if (Phaser.Input.Keyboard.JustDown(this.keys.shoot)) this.shootPistol();
    this.updateZombie();
    this.updateJimFollow();
    GameState.minutes += 0.03;
    if (GameState.minutes >= 1440) { GameState.minutes = 0; GameState.day += 1; }
    this.updateHUD();
  }
}

class AutoShopInteriorScene extends BaseScene {
  constructor() { super("AutoShopInteriorScene"); }
  preload() {
    this.load.on("loaderror", (file) => {
      console.warn("Asset failed:", file && file.src);
    });
    this.load.spritesheet("donny", "assets/characters/donny_walk_4dir_128x128_phaser.png?v=030", { frameWidth: 128, frameHeight: 128 });
    this.load.spritesheet("donny_punch", "assets/characters/donny_punch_4dir_128x128_phaser.png?v=030", { frameWidth: 128, frameHeight: 128 });
    this.load.image("pistol", "assets/weapons/pistol.png?v=043");
    this.load.image("auto_shop_interior_bg", "assets/interiors/auto_shop_empty_interior.png?v=034");
    this.load.spritesheet("auto_shop_large_props", "assets/props/auto_shop_large_props_256x128.png?v=043", { frameWidth: 256, frameHeight: 128 });
    this.load.spritesheet("auto_shop_small_props", "assets/props/auto_shop_small_props_128x128.png?v=043", { frameWidth: 128, frameHeight: 128 });
    this.load.audio("bg_music", "assets/audio/Grain Silo Ghosts.mp3?v=033");
  }
  create() {
    this.setupMobile();
    this.physics.world.setBounds(0, 0, 1280, 720);
    this.cameras.main.setBounds(0, 0, 1280, 720);
    this.solidObjects = this.physics.add.staticGroup();
    this.makeInterior();
    this.createPlayer(640, 560);
    this.createPlayerAnims();
    this.keys = this.input.keyboard.addKeys({ up:"W", down:"S", left:"A", right:"D", interact:"E", attack:"SPACE", shoot:"F", pause:"P", music:"M" });
    this.createHUD("v0.4.3 - Bigger Cars + Held Shooting + Worker Zombie");
    this.createControls();
    this.ensureMusic();
    this.input.once("pointerdown", () => this.ensureMusic(true));
  }
  makeInterior() {
    // Game-ready empty interior background.
    // File path: assets/interiors/auto_shop_empty_interior.png
    this.add.image(640, 360, "auto_shop_interior_bg").setDisplaySize(1280, 720).setDepth(0);

    // New auto shop prop sheets.
    this.add.image(310, 210, "auto_shop_large_props", 0).setScale(0.62).setDepth(210);  // tire rack
    this.add.image(640, 230, "auto_shop_large_props", 1).setScale(0.62).setDepth(230);  // workbench
    this.add.image(955, 220, "auto_shop_large_props", 2).setScale(0.60).setDepth(220);  // parts/tool shelf
    this.add.image(300, 430, "auto_shop_large_props", 3).setScale(0.58).setDepth(430);  // toolbox
    this.add.image(640, 430, "auto_shop_large_props", 4).setScale(0.58).setDepth(430);  // storage bench
    this.add.image(1055, 380, "auto_shop_large_props", 5).setScale(0.62).setDepth(380); // door/locker prop

    this.add.image(470, 500, "auto_shop_small_props", 0).setScale(0.42).setDepth(500);  // wrench
    this.add.image(810, 500, "auto_shop_small_props", 2).setScale(0.45).setDepth(500);  // gas can
    this.add.image(610, 520, "auto_shop_small_props", 4).setScale(0.45).setDepth(520);  // crate
    this.add.image(760, 535, "auto_shop_small_props", 6).setScale(0.48).setDepth(535);  // grate

    // Invisible collision boundaries placed along the bottom edge of the walls.
    // This keeps Donny's feet from walking through the wall art.
    this.makeInvisibleWall(640, 150, 900, 44);      // top wall base
    this.makeInvisibleWall(190, 400, 46, 430);      // left wall base
    this.makeInvisibleWall(1140, 410, 46, 430);     // right wall base
    this.makeInvisibleWall(390, 668, 450, 54);      // bottom wall left of exit
    this.makeInvisibleWall(900, 668, 450, 54);      // bottom wall right of exit
    this.makeInvisibleWall(1075, 210, 170, 48);     // office/side-room wall base

    // Invisible interaction zones. Props will be placed visually later.
    this.toolbox = this.add.zone(640, 500, 120, 90);
    this.physics.add.existing(this.toolbox, true);

    this.exitDoor = this.add.zone(640, 690, 220, 70);
    this.physics.add.existing(this.exitDoor, true);
  }

  makeInvisibleWall(x, y, w, h) {
    const wall = this.add.rectangle(x, y, w, h, 0xff0000, 0);
    this.physics.add.existing(wall, true);
    this.solidObjects.add(wall);
    return wall;
  }

  makeSolidInterior(x, y, w, h, color, label) {
    const obj = this.add.rectangle(x, y, w, h, color, 1);
    this.physics.add.existing(obj, true); this.solidObjects.add(obj);
    this.add.text(x, y, label, { fontSize:"14px", color:"#ffffff", fontFamily:"Arial" }).setOrigin(0.5);
  }
  tryInteract() {
    const dExit = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.exitDoor.x, this.exitDoor.y);
    if (dExit < 130) { this.scene.start("MainStreetScene", { fromInterior: true }); return; }
    const dTool = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.toolbox.x, this.toolbox.y);
    if (dTool < 130) {
      if (!GameState.wrenchFound) {
        GameState.wrenchFound = true;
        if (!GameState.inventory.includes("Wrench")) GameState.inventory.push("Wrench");
        GameState.wood += 2;
        GameState.mission = "Return Wrench To Jim";
        this.makeDialogue("Toolbox", "Found Wrench. Also found Wood +2.");
      } else this.makeDialogue("Toolbox", "Already searched.");
    }
  }
  update() {
    this.handleVirtualStick();
    if (Phaser.Input.Keyboard.JustDown(this.keys.pause)) this.togglePauseMenu();
    if (Phaser.Input.Keyboard.JustDown(this.keys.music)) this.toggleMusic();
    if (GameState.pausedMenuOpen) {
      this.player.setVelocity(0);
      this.updateHUD();
      return;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keys.interact)) this.tryInteract();
    if (Phaser.Input.Keyboard.JustDown(this.keys.attack)) this.attack();
    if (Phaser.Input.Keyboard.JustDown(this.keys.shoot)) this.shootPistol();
    this.handlePlayerMovement([this.solidObjects]);
    if (this.physics.overlap(this.player, this.exitDoor)) { this.scene.start("MainStreetScene", { fromInterior: true }); return; }
    GameState.minutes += 0.02;
    if (GameState.minutes >= 1440) { GameState.minutes = 0; GameState.day += 1; }
    this.updateHUD();
  }
}

const config = {
  type: Phaser.AUTO,
  width: 1280,
  height: 720,
  backgroundColor: "#111111",
  parent: document.body,
  physics: { default: "arcade", arcade: { debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 1280, height: 720 },
  scene: [MainStreetScene, AutoShopInteriorScene]
};
new Phaser.Game(config);
</script>
