<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Stuck In Iowa: Dead County</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:#111;
touch-action:none;
}

canvas{
display:block;
margin:auto;
}
</style>
</head>

<body>

<script>

class MainStreetScene extends Phaser.Scene{

constructor(){
super("MainStreet");
}

preload(){

this.load.spritesheet(
"donny",
"assets/characters/donny_walk_4dir_128x128_phaser.png",
{
frameWidth:128,
frameHeight:128
}
);

}

create(){

this.mobile={
up:false,
down:false,
left:false,
right:false
};

this.physics.world.setBounds(0,0,2400,1400);

this.cameras.main.setBounds(0,0,2400,1400);

this.add.rectangle(
1200,
700,
2400,
1400,
0x36542d
);

this.add.rectangle(
1200,
700,
2400,
320,
0x2d2d2d
);

for(let x=0;x<2400;x+=220){

this.add.rectangle(
x,
700,
120,
12,
0xd8b64d
);

}

this.add.rectangle(
1150,
250,
320,
220,
0x555555
);

this.add.text(
1150,
250,
"AUTO SHOP",
{
fontSize:"28px",
color:"#ffffff"
}
).setOrigin(0.5);

this.safehouse=this.add.rectangle(
1150,
250,
250,
180,
0x00ff00,
0.2
);

this.player=this.physics.add.sprite(
1200,
700,
"donny",
0
);

this.player.setCollideWorldBounds(true);

this.player.setScale(1);

this.cameras.main.startFollow(
this.player,
true,
0.08,
0.08
);

this.jim=this.add.rectangle(
1000,
520,
40,
60,
0x00ffff
);

this.add.text(
970,
470,
"JIM",
{
fontSize:"18px",
color:"#ffffff"
}
);

this.food=5;
this.medicine=2;
this.wood=8;
this.survivors=0;

this.jimFollowing=false;

this.mission=this.add.text(
20,
20,
"Talk To Jim",
{
fontSize:"24px",
color:"#ffff00"
}
)
.setScrollFactor(0);

this.resources=this.add.text(
20,
60,
"",
{
fontSize:"18px",
color:"#ffffff"
}
)
.setScrollFactor(0);

this.createMobileControls();

}

createMobileControls(){

const baseX=120;
const baseY=600;

this.stickBase=this.add.circle(
baseX,
baseY,
65,
0x000000,
0.45
)
.setScrollFactor(0)
.setInteractive();

this.stickKnob=this.add.circle(
baseX,
baseY,
28,
0xffffff,
0.55
)
.setScrollFactor(0);

this.stickActive=false;

this.stickBase.on("pointerdown",()=>{
this.stickActive=true;
});

this.input.on("pointerup",()=>{

this.stickActive=false;

this.mobile.left=false;
this.mobile.right=false;
this.mobile.up=false;
this.mobile.down=false;

this.stickKnob.x=baseX;
this.stickKnob.y=baseY;

});

this.input.on("pointermove",(pointer)=>{

if(!this.stickActive)return;

const dx=pointer.x-baseX;
const dy=pointer.y-baseY;

this.mobile.left=dx<-20;
this.mobile.right=dx>20;
this.mobile.up=dy<-20;
this.mobile.down=dy>20;

const dist=Math.min(
40,
Math.sqrt(dx*dx+dy*dy)
);

const angle=Math.atan2(dy,dx);

this.stickKnob.x=
baseX+
Math.cos(angle)*dist;

this.stickKnob.y=
baseY+
Math.sin(angle)*dist;

});

const btn=this.add.circle(
1180,
600,
55,
0x444444,
0.75
)
.setScrollFactor(0)
.setInteractive();

this.add.text(
1180,
600,
"A",
{
fontSize:"28px",
color:"#ffffff"
}
)
.setOrigin(0.5)
.setScrollFactor(0);

btn.on("pointerdown",()=>{

const d=Phaser.Math.Distance.Between(
this.player.x,
this.player.y,
this.jim.x,
this.jim.y
);

if(d<120 && !this.jimFollowing){

this.jimFollowing=true;

this.mission.setText(
"Escort Jim To Auto Shop"
);

}

});

}

update(){

const speed=240;

this.player.setVelocity(0);

if(this.mobile.left){
this.player.setVelocityX(-speed);
}

if(this.mobile.right){
this.player.setVelocityX(speed);
}

if(this.mobile.up){
this.player.setVelocityY(-speed);
}

if(this.mobile.down){
this.player.setVelocityY(speed);
}

this.player.body.velocity
.normalize()
.scale(speed);

if(this.jimFollowing){

const angle=
Phaser.Math.Angle.Between(
this.jim.x,
this.jim.y,
this.player.x,
this.player.y
);

this.jim.x+=Math.cos(angle)*1.4;
this.jim.y+=Math.sin(angle)*1.4;

const safeDist=
Phaser.Math.Distance.Between(
this.jim.x,
this.jim.y,
1150,
250
);

if(
safeDist<100 &&
this.survivors===0
){

this.food+=3;
this.medicine+=1;
this.wood+=5;
this.survivors=1;

this.mission.setText(
"AUTO SHOP SECURED"
);

}

}

this.resources.setText(
"Food: "+this.food+
"\nMedicine: "+this.medicine+
"\nWood: "+this.wood+
"\nSurvivors: "+this.survivors
);

}

}

new Phaser.Game({

type:Phaser.AUTO,

width:1280,
height:720,

backgroundColor:"#111111",

physics:{
default:"arcade",
arcade:{
debug:false
}
},

scale:{
mode:Phaser.Scale.FIT,
autoCenter:Phaser.Scale.CENTER_BOTH
},

scene:[MainStreetScene]

});

</script>

</body>
</html>
