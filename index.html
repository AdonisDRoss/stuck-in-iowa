<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Stuck in Iowa: Dead County</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; background: #111; overflow: hidden; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
<script>
class MainStreetScene extends Phaser.Scene {
  constructor() {
    super("MainStreetScene");
  }

  create() {
    this.physics.world.setBounds(0, 0, 2400, 1400);
    this.cameras.main.setBounds(0, 0, 2400, 1400);
    this.cameras.main.setBackgroundColor("#1b241b");

    // Grass background
    this.add.rectangle(1200, 700, 2400, 1400, 0x2d3a25);

    // Main road
    this.add.rectangle(1200, 700, 2400, 320, 0x2a2a2a);

    // Road shoulder
    this.add.rectangle(1200, 520, 2400, 40, 0x555555);
    this.add.rectangle(1200, 880, 2400, 40, 0x555555);

    // Yellow center line
    for (let x = 80; x < 2400; x += 160) {
      this.add.rectangle(x, 700, 90, 12, 0xd8c542);
    }

    // Sidewalks
    this.add.rectangle(1200, 460, 2400, 70, 0x777777);
    this.add.rectangle(1200, 940, 2400, 70, 0x777777);

    // Buildings - top side
    this.makeBuilding(250, 250, 300, 220, "GAS");
    this.makeBuilding(650, 250, 340, 220, "DINER");
    this.makeBuilding(1100, 250, 360, 220, "AUTO");
    this.makeBuilding(1600, 250, 320, 220, "BAR");
    this.makeBuilding(2050, 250, 380, 220, "MOTEL");

    // Buildings - bottom side
    this.makeBuilding(350, 1150, 360, 220, "HOUSE");
    this.makeBuilding(850, 1150, 360, 220, "STORE");
    this.makeBuilding(1350, 1150, 420, 220, "CLINIC");
    this.makeBuilding(1900, 1150, 420, 220, "POLICE");

    // Cornfield edge
    for (let x = 0; x < 2400; x += 40) {
      this.add.rectangle(x, 60, 20, 120, 0x8a7a28);
      this.add.rectangle(x + 20, 1330, 20, 120, 0x8a7a28);
    }

    // Player placeholder
    this.player = this.physics.add.rectangle(1200, 700, 42, 64, 0x33aaff);
    this.player.body.setCollideWorldBounds(true);

    this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys({
      up: "W",
      down: "S",
      left: "A",
      right: "D"
    });

    this.add.text(20, 20, "STUCK IN IOWA: DEAD COUNTY", {
      fontSize: "26px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setScrollFactor(0);

    this.add.text(20, 55, "Main Street Chunk 01 - No assets", {
      fontSize: "16px",
      color: "#cccccc",
      fontFamily: "Arial"
    }).setScrollFactor(0);
  }

  makeBuilding(x, y, w, h, label) {
    this.add.rectangle(x, y, w, h, 0x3b3b3b);
    this.add.rectangle(x, y - h / 2 + 18, w, 36, 0x222222);
    this.add.text(x, y - 15, label, {
      fontSize: "28px",
      color: "#ffffff",
      fontFamily: "Arial"
    }).setOrigin(0.5);
  }

  update() {
    const speed = 250;

    this.player.body.setVelocity(0);

    if (this.cursors.left.isDown || this.keys.left.isDown) {
      this.player.body.setVelocityX(-speed);
    }
    if (this.cursors.right.isDown || this.keys.right.isDown) {
      this.player.body.setVelocityX(speed);
    }
    if (this.cursors.up.isDown || this.keys.up.isDown) {
      this.player.body.setVelocityY(-speed);
    }
    if (this.cursors.down.isDown || this.keys.down.isDown) {
      this.player.body.setVelocityY(speed);
    }

    this.player.body.velocity.normalize().scale(speed);
  }
}

const config = {
  type: Phaser.AUTO,
  width: 1280,
  height: 720,
  backgroundColor: "#111111",
  physics: {
    default: "arcade",
    arcade: { debug: false }
  },
  scene: [MainStreetScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
