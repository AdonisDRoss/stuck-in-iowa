<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Stuck In Iowa: Dead County</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
}
canvas{
    display:block;
}
</style>
</head>

<body>

<script>

class MainStreetScene extends Phaser.Scene{

    constructor(){
        super("MainStreet");
    }

    preload(){

        this.load.spritesheet(
            "donny",
            "assets/characters/donny_walk_4dir_128x128_phaser.png",
            {
                frameWidth:128,
                frameHeight:128
            }
        );

    }

    create(){

        this.physics.world.setBounds(0,0,2400,1400);

        this.cameras.main.setBounds(0,0,2400,1400);

        this.add.rectangle(
            1200,
            700,
            2400,
            1400,
            0x35502f
        );

        this.add.rectangle(
            1200,
            700,
            2400,
            300,
            0x2b2b2b
        );

        for(let x=50;x<2400;x+=180){

            this.add.rectangle(
                x,
                700,
                90,
                12,
                0xd9b54c
            );
        }

        this.makeBuilding(
            250,
            250,
            300,
            220,
            "GAS"
        );

        this.makeBuilding(
            700,
            250,
            350,
            220,
            "DINER"
        );

        this.makeBuilding(
            1150,
            250,
            350,
            220,
            "AUTO"
        );

        this.makeBuilding(
            1600,
            250,
            350,
            220,
            "BAR"
        );

        this.makeBuilding(
            2050,
            250,
            350,
            220,
            "MOTEL"
        );

        this.player =
            this.physics.add.sprite(
                1200,
                700,
                "donny",
                0
            );

        this.player.setCollideWorldBounds(true);

        this.cameras.main.startFollow(
            this.player
        );

        this.jim =
            this.add.rectangle(
                1050,
                500,
                40,
                60,
                0x00ffff
            );

        this.add.text(
            1020,
            450,
            "JIM",
            {
                color:"#fff"
            }
        );

        this.safehouse =
            this.add.rectangle(
                1150,
                250,
                260,
                180,
                0x00ff00,
                0.20
            );

        this.food=5;
        this.medicine=2;
        this.wood=8;
        this.survivors=0;

        this.jimFollowing=false;
        this.safehouseUnlocked=false;

        this.mission=
            this.add.text(
                20,
                20,
                "Talk To Jim",
                {
                    fontSize:"22px",
                    color:"#ffff00"
                }
            )
            .setScrollFactor(0);

        this.resources=
            this.add.text(
                20,
                60,
                "",
                {
                    fontSize:"18px",
                    color:"#ffffff"
                }
            )
            .setScrollFactor(0);

        this.keys =
            this.input.keyboard.addKeys({
                up:"W",
                down:"S",
                left:"A",
                right:"D",
                interact:"E"
            });

        this.mobile={
            up:false,
            down:false,
            left:false,
            right:false
        };

        this.createMobileControls();
    }

    makeBuilding(x,y,w,h,name){

        this.add.rectangle(
            x,
            y,
            w,
            h,
            0x444444
        );

        this.add.text(
            x,
            y,
            name,
            {
                fontSize:"26px",
                color:"#ffffff"
            }
        ).setOrigin(0.5);
    }

    createMobileControls(){

        const left =
            this.add.circle(
                120,
                600,
                55,
                0x000000,
                0.4
            )
            .setScrollFactor(0)
            .setInteractive();

        const right =
            this.add.circle(
                1180,
                600,
                55,
                0x444444,
                0.7
            )
            .setScrollFactor(0)
            .setInteractive();

        this.add.text(
            1180,
            600,
            "A",
            {
                fontSize:"28px",
                color:"#fff"
            }
        )
        .setOrigin(0.5)
        .setScrollFactor(0);

    }

    update(){

        const speed=220;

        this.player.setVelocity(0);

        if(this.keys.left.isDown)
            this.player.setVelocityX(-speed);

        if(this.keys.right.isDown)
            this.player.setVelocityX(speed);

        if(this.keys.up.isDown)
            this.player.setVelocityY(-speed);

        if(this.keys.down.isDown)
            this.player.setVelocityY(speed);

        this.player.body.velocity
            .normalize()
            .scale(speed);

        const dist=
            Phaser.Math.Distance.Between(
                this.player.x,
                this.player.y,
                this.jim.x,
                this.jim.y
            );

        if(
            dist<90 &&
            Phaser.Input.Keyboard.JustDown(
                this.keys.interact
            ) &&
            !this.jimFollowing
        ){

            this.jimFollowing=true;

            this.mission.setText(
                "Escort Jim To Auto Shop"
            );
        }

        if(this.jimFollowing){

            const angle=
                Phaser.Math.Angle.Between(
                    this.jim.x,
                    this.jim.y,
                    this.player.x,
                    this.player.y
                );

            this.jim.x+=Math.cos(angle)*1.5;
            this.jim.y+=Math.sin(angle)*1.5;

            const safeDist=
                Phaser.Math.Distance.Between(
                    this.jim.x,
                    this.jim.y,
                    1150,
                    250
                );

            if(
                safeDist<100 &&
                !this.safehouseUnlocked
            ){

                this.safehouseUnlocked=true;

                this.food+=3;
                this.medicine+=1;
                this.wood+=5;
                this.survivors+=1;

                this.mission.setText(
                    "AUTO SHOP SECURED"
                );
            }
        }

        this.resources.setText(
            "Food: "+this.food+
            "\nMedicine: "+this.medicine+
            "\nWood: "+this.wood+
            "\nSurvivors: "+this.survivors
        );
    }
}

new Phaser.Game({

    type:Phaser.AUTO,

    width:1280,
    height:720,

    physics:{
        default:"arcade",
        arcade:{
            debug:false
        }
    },

    scale:{
        mode:Phaser.Scale.FIT,
        autoCenter:Phaser.Scale.CENTER_BOTH
    },

    scene:[MainStreetScene]
});

</script>

</body>
</html>
